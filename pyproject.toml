[project]
name = "nanobanana-app-vs-api"
version = "0.1.0"
description = "Multi-turn image editing with Nano Banana 2: Gemini app vs Interactions API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.18.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nanobanana"
